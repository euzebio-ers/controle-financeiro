services:
  db:
    image: mysql:8.4
    container_name: cf-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo database/.env}
      TZ: America/Bahia
    ports:
      - "3306:3306"
    volumes:
      - ./database/script.sql:/docker-entrypoint-initdb.d/script.sql:ro
      - dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    container_name: cf-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/controle_financeiro
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Bahia
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    image: nginx:alpine
    container_name: cf-frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  dados:
