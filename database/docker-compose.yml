services:
  mysql:
    image: mysql:8.4
    container_name: controle-financeiro-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Bahia
    ports:
      - "3306:3306"
    volumes:
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql:ro
      - dados:/var/lib/mysql

volumes:
  dados:
